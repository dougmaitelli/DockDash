version: 2
updates:
  - package-ecosystem: npm
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      application-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      react-major:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major
      vite-major:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/*"
        update-types:
          - major
      eslint-major:
        applies-to: version-updates
        patterns:
          - eslint
          - "@eslint/*"
          - eslint-*
          - "@typescript-eslint/*"
          - typescript-eslint
        update-types:
          - major
      vitest-major:
        applies-to: version-updates
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - major
      prettier-major:
        applies-to: version-updates
        patterns:
          - prettier
          - prettier-plugin-*
        update-types:
          - major
      application-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
    directory: /
  - package-ecosystem: npm
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docs-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      astro-major:
        applies-to: version-updates
        patterns:
          - astro
          - "@astrojs/*"
        update-types:
          - major
      docs-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
    directory: /docs
  - package-ecosystem: npm
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      browser-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      playwright-major:
        applies-to: version-updates
        patterns:
          - playwright
          - playwright-core
          - "@playwright/*"
        update-types:
          - major
      browser-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
    directory: /e2e
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    directory: /
    open-pull-requests-limit: 3
    groups:
      container-images-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      container-images-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    directory: /e2e
    open-pull-requests-limit: 3
    groups:
      browser-images-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      browser-images-security:
        applies-to: security-updates
        patterns:
          - "*"
