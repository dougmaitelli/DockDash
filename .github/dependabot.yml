version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      playwright:
        patterns:
          - playwright
          - "@playwright/test"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]
