version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /docs
      - /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "eslint*"
      vite:
        patterns:
          - vite
          - "@vitejs/*"
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      playwright:
        patterns:
          - playwright
          - "@playwright/test"
      prettier:
        patterns:
          - prettier
          - prettier-plugin-astro
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]

  - package-ecosystem: docker
    directories:
      - /
      - /e2e
    schedule:
      interval: weekly
    labels: [dependencies, docker]
