name: UI Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  visual:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run in the canonical browser environment
        run: sh e2e/run-docker.sh
      - name: Upload report, traces, and screenshot differences
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
