name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
      browser: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.browser == 'true' }}
      docs: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
      runtime: ${{ github.ref_type == 'tag' || steps.filter.outputs.runtime == 'true' }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: every
          filters: |
            runtime:
              - '{src/**,drizzle/**,Dockerfile,.dockerignore,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,vite.config.ts,tsconfig*.json}'
            app:
              - '{src/**,drizzle/**,scripts/**,e2e/**,Dockerfile,.dockerignore,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,*config*,.prettier*,.github/**}'
            browser:
              - '{src/**,drizzle/**,scripts/**,e2e/**,screenshots/**,Dockerfile,.dockerignore,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,*config*,.github/workflows/**}'
            docs:
              - '{docs/**,screenshots/**,.github/workflows/**,src/client/public/logo.svg,package.json,pnpm-workspace.yaml}'
      - name: Validate release tag
        id: version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          numeric='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          [[ "$TAG" =~ ^v${numeric}\.${numeric}\.${numeric}(-${identifier}(\.${identifier})*)?$ ]] || exit 1
          if [[ "$TAG" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'prerelease=false' >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
      - run: pnpm build

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [changes, docker-manifest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    concurrency:
      group: github-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --current --strip header

      - name: Select latest stable release
        id: latest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=version:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | tail -1)
          echo "publish=$([[ "$latest" == "$TAG" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.cliff.outputs.content }}
          prerelease: ${{ needs.changes.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.latest.outputs.publish }}

  docker:
    name: Build & Push Docker image
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    needs: [changes, ci-result]
    if: >-
      always() && github.event_name == 'push' &&
      needs.ci-result.result == 'success' && needs.changes.outputs.runtime == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_REPO=${{ github.repository }}
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*

  docker-manifest:
    needs: [changes, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-manifest-publication-${{ github.ref_type }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish combined image
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          [[ "$REF_TYPE" == tag ]] || TAG=dev
          args=(-t "$image:$TAG")
          if [[ "$REF_TYPE" == tag && "$TAG" != *-* ]]; then
            major="${TAG%.*.*}"
            minor="${TAG%.*}"
            stable=$(git tag --list 'v*' --sort=version:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$')
            [[ "$(printf '%s\n' "$stable" | tail -1)" != "$TAG" ]] || args+=(-t "$image:latest")
            [[ "$(printf '%s\n' "$stable" | grep -E "^${major//./\\.}\." | tail -1)" != "$TAG" ]] || args+=(-t "$image:$major")
            [[ "$(printf '%s\n' "$stable" | grep -E "^${minor//./\\.}\." | tail -1)" != "$TAG" ]] || args+=(-t "$image:$minor")
          fi
          for digest in /tmp/digests/*; do
            args+=("$image@sha256:${digest##*/}")
          done
          docker buildx imagetools create "${args[@]}"

  ui:
    name: Browser tests
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    uses: ./.github/workflows/ui-tests.yml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

  ci-result:
    name: CI result
    if: always()
    needs: [changes, format, lint, test, ui, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to pass
        env:
          FAILED: ${{ needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
